id: U-DEMO-BETREUER
name: Demo-Upgrade fuer Betreuer-Besprechung
version: '1.0'
domain: construction_machinery
status: draft
description: 'Demo-Familie fuer die Live-Vorfuehrung des Kontenrahmens: zwei Sparmechanismen
  sind fertig formuliert, aber bewusst noch keinem output_bucket zugeordnet. Zahlen
  angelehnt an U-ELEC-CABLE::EZ17.'
components:
- Elektromotor (AC-Asynchron oder PMSM)
- Umrichter / Frequenzumformer
interfaces: []
performance_delta: {}
component_cost_eur: 15000.0
installation_cost_eur: 1200.0
disposal_cost_eur: 400.0
feasibility_gate:
  condition_description: Mittlerer Aktionsradius der Maschine <= 200 m/h
  dimension_ref: hourly_distance
  threshold: 200.0
  operator: <=
savings_mechanism:
  name: root
  node_type: branch
  mechanism: null
  operator: sum
  children:
  - name: cost
    node_type: branch
    mechanism: null
    operator: sum
    children:
    - name: capex
      node_type: branch
      mechanism: null
      operator: sum
      children:
      - name: component
        node_type: branch
        mechanism: null
        operator: sum
        children: []
        edge_modifier: null
      - name: installation_base
        node_type: branch
        mechanism: null
        operator: sum
        children: []
        edge_modifier: null
      - name: disposal_prev
        node_type: branch
        mechanism: null
        operator: sum
        children: []
        edge_modifier: null
      edge_modifier: null
    - name: opex
      node_type: branch
      mechanism: null
      operator: sum
      children:
      - name: energy
        node_type: branch
        mechanism: null
        operator: sum
        children:
        - name: energie_einsparung
          node_type: leaf
          mechanism:
            formula: op_hours_year * fuel_rate_l_h * (diesel_price_eur_l - electricity_equiv_eur_l)
            factors:
            - name: op_hours_year
              dimension_ref: op_hours_year
              description: Jaehrliche Betriebsstunden
            - name: fuel_rate_l_h
              dimension_ref: fuel_rate_l_h
              description: Kraftstoffverbrauch
            - name: diesel_price_eur_l
              dimension_ref: diesel_price_eur_l
              description: Dieselpreis
            - name: electricity_equiv_eur_l
              dimension_ref: electricity_equiv_eur_l
              description: Strom-Aequivalent
            unit: EUR/year
            output_bucket: cost.opex.energy
          operator: null
          children: []
          edge_modifier:
            kind: veto_scaled
            gate:
              condition_description: Aktionsradius <= 200 m/h (Machbarkeits-Abdeckung)
              dimension_ref: hourly_distance
              threshold: 200.0
              operator: <=
            factor: null
            with_upgrade: null
            description: ''
        edge_modifier: null
      - name: maintenance
        node_type: branch
        mechanism: null
        operator: sum
        children:
        - name: wartungs_einsparung
          node_type: leaf
          mechanism:
            formula: maintenance_interval_h * 5.0
            factors:
            - name: maintenance_interval_h
              dimension_ref: maintenance_interval_h
              description: Wartungsintervall (bewusst nicht operationalisierbar)
            unit: EUR/year
            output_bucket: cost.opex.maintenance
          operator: null
          children: []
          edge_modifier:
            kind: synergy_multiplier
            gate: null
            factor: 0.7
            with_upgrade: U-MINIBATT
            description: ''
        edge_modifier: null
      - name: downtime
        node_type: branch
        mechanism: null
        operator: sum
        children: []
        edge_modifier: null
      edge_modifier: null
    edge_modifier: null
  edge_modifier: null
requires: []
excludes: []
synergies: []
data_dimensions:
- name: hourly_distance
  kind: EC
  unit: m/h
  resolution: L3
  description: Mittlerer Aktionsradius, Proxy aus Fahrgeschwindigkeiten.
- name: op_hours_year
  kind: EC
  unit: h/year
  resolution: L1
  description: Jaehrliche Betriebsstunden.
- name: fuel_rate_l_h
  kind: instance
  unit: L/h
  resolution: L1
  description: Kraftstoffverbrauch, Instanz-Festwert.
- name: diesel_price_eur_l
  kind: context
  unit: EUR/L
  resolution: L0
  description: Dieselpreis, Marktparameter.
- name: electricity_equiv_eur_l
  kind: context
  unit: EUR/L
  resolution: L0
  description: Strom-Aequivalentpreis, Marktparameter.
- name: maintenance_interval_h
  kind: EC
  unit: h
  resolution: L2
  description: Wartungsintervall — bewusst kein Signal verfuegbar (Demo fuer missing-Caveat).
source: Demo-Vorlage / Betreuer-Besprechung
confidence: 0.6
date: '2026-07-06'
notes: 'Live-Demo: zwei Mechanismen ohne output_bucket, ein veto_scaled- und ein synergy_multiplier-Modifikator
  ohne Kantenzuordnung. Im Tab ''Bucket-Baum'' live zuordnen.'
